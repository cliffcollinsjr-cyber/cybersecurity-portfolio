# Portfolio CI: lint + Python tests + Go build
# [DEMO] No secrets. Production: pin every action to a commit SHA.
name: ci-portfolio

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: lint-test-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # production: pin to commit SHA
      - name: Setup Python
        uses: actions/setup-python@v5 # production: pin to commit SHA
        with:
          python-version: "3.12"
      - name: Setup Go
        uses: actions/setup-go@v5 # production: pin to commit SHA
        with:
          go-version: "1.22"
      - name: make lint
        run: make lint
        continue-on-error: false
      - name: make test-python
        run: make test-python
        continue-on-error: false
      - name: make build-go
        run: make build-go
        continue-on-error: false
