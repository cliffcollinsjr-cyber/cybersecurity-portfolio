# [DEMO] Dependabot — weekly GitHub Actions + pip
# Production: add reviewers/assignees and a CODEOWNERS-aligned team.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /soc-automation/python-alert-enrichment
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
